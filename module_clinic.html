const status={confirmed:{text:'Confirmado',color:'#148251',bg:'#e7f5ed',pill:'green'},pending:{text:'Aguardando autorização',color:'#ad7a20',bg:'#fff3d9',pill:'orange'},available:{text:'Disponível',color:'#7e64a5',bg:'#f1ebf9',pill:'purple'}};const fmt=n=>`${String(Math.floor(n)).padStart(2,'0')}:${n%1?'30':'00'}`;const dayDate=d=>new Date(2026,8,28+d+offset*7);const dateText=d=>dayDate(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(s){screen=s;view='week';offset=0;unit='Todas as unidades';filters=new Set(['confirmed','pending','available']);render();window.scrollTo(0,0)}
function footer(){return `<div class="bottom"><span>Unimed Sorocaba · Central do Cooperado</span><span>Ambiente demonstrativo · Informações e valores fictícios</span></div>`}
function home(){return `<div class="section-title home-title"><h2>O que você precisa hoje?</h2><span>Serviços para o cooperado</span></div><div class="cards">${services.map(s=>`<button class="service" style="--accent:${s.color}" onclick="go('${s.id}')">${icon('arrow','corner')}${icon(s.icon,'art')}<h3>${s.title}</h3><p>${s.desc}</p><div class="foot"><span>${s.tag}</span>${icon('arrow')}</div></button>`).join('')}</div>`}
function heading(title,sub,button=''){return `<button class="btn back" onclick="go('home')">${icon('chevron')} Central do Cooperado</button><div class="agenda-heading"><div><div class="eyebrow">Serviços do cooperado</div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function calendar(){let diag=screen==='diagnostic';let start=dayDate(0),end=dayDate(4);let range=`${dateText(0)} a ${dateText(4)} · ${end.getFullYear()}`;let evs=events.filter(e=>e.type===screen&&filters.has(e.status)&&(unit==='Todas as unidades'||unit===e.unit));return `${heading(diag?'Agenda de diagnóstico':'Agenda de cirurgia',diag?'Exames e procedimentos organizados na sua semana.':'Sua programação cirúrgica, com horários e status em um só lugar.',`<button class="btn primary" onclick="newEvent()">${icon('plus')} ${diag?'Agendar exame':'Solicitar agendamento'}</button>`)}<div class="agenda-layout"><aside class="agenda-side"><div class="mini-title">${start.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div><div class="mini">${['D','S','T','Q','Q','S','S'].map(x=>`<span class="mini-day">${x}</span>`).join('')}${Array.from({length:35},(_,i)=>{let d=new Date(start.getFullYear(),start.getMonth(),1);d.setDate(i-d.getDay()+1);let selected=d.toDateString()===dayDate(4).toDateString();return `<span class="${selected?'selected':d>=start&&d<=end?'week':''}" style="${d.getMonth()!==start.getMonth()?'opacity:.35':''}">${d.getDate()}</span>`}).join('')}</div><div class="side-label">Local de atendimento</div><select aria-label="Filtrar unidade" onchange="unit=this.value;render()">${['Todas as unidades','HMS',diag?'Iguatemi':'Hospital Rodolfo'].map(x=>`<option ${unit===x?'selected':''}>${x}</option>`).join('')}</select><div class="side-label">Exibir na agenda</div>${Object.entries(status).map(([key,s])=>`<label class="filter"><input type="checkbox" ${filters.has(key)?'checked':''} onchange="toggleFilter('${key}',this.checked)"><span class="dot" style="background:${s.color}"></span>${s.text}</label>`).join('')}<div class="side-note">${icon('calendar')}<br><b>Sua semana, com clareza.</b><br>Clique em um compromisso para ver os detalhes ou em um horário disponível para simular uma solicitação.</div></aside><section class="calendar-main"><div class="cal-toolbar"><div class="cal-tools"><button class="btn" onclick="offset=0;render()">Hoje</button><button class="btn" aria-label="Semana anterior" onclick="offset--;render()">${icon('chevron')}</button><button class="btn" aria-label="Próxima semana" onclick="offset++;render()"><span style="transform:rotate(180deg)">${icon('chevron')}</span></button><span class="cal-range">${range}</span></div><div class="segmented">${[['day','Dia'],['week','Semana'],['list','Lista']].map(([key,title])=>`<button class="${view===key?'active':''}" onclick="view='${key}';render()">${title}</button>`).join('')}</div></div>${view==='list'?eventList(evs):calendarGrid(evs)}<div class="legend">${Object.values(status).map(s=>`<span><i class="dot" style="background:${s.color}"></i>${s.text}</span>`).join('')}</div></section></div>${footer()}`}
function calendarGrid(evs){let days=view==='day'?[4]:[0,1,2,3,4];return `<div class="calendar-scroll"><div class="calendar" style="${view==='day'?'min-width:350px':''}"><div class="days" style="grid-template-columns:52px repeat(${days.length},1fr)"><div></div>${days.map(d=>`<div class="${d===4&&offset===0?'today':''}">${['SEG','TER','QUA','QUI','SEX'][d]}<b>${dayDate(d).getDate()}</b></div>`).join('')}</div><div class="timegrid" style="grid-template-columns:52px repeat(${days.length},1fr)"><div class="hours">${Array.from({length:10},(_,i)=>`<span style="top:${i*60+10}px">${String(i+7).padStart(2,'0')}:00</span>`).join('')}</div>${days.map(d=>`<div class="daycol ${d===4?'current':''}">${offset===0?evs.filter(e=>e.day===d).map(e=>{let s=status[e.status];let color=e.status==='confirmed'&&screen==='diagnostic'?'#277bab':s.color;let bg=e.status==='confirmed'&&screen==='diagnostic'?'#e8f3fc':s.bg;return `<button class="event" style="top:${(e.start-7)*60}px;height:${e.duration*60-5}px;--event-color:${color};--event-bg:${bg}" onclick="eventDetail(${e.id})">${fmt(e.start)} – ${fmt(e.start+e.duration)}<b>${esc(e.title)}</b><small>${esc(e.unit)} · ${esc(e.place)}</small></button>`}).join(''):''}${d===4&&offset===0?'<div class="now"></div>':''}</div>`).join('')}</div></div></div>${offset!==0?'<p style="padding:0 18px;font-size:11px">Não há compromissos de exemplo nesta semana.</p>':''}`}
function eventList(evs){return `<div class="tablewrap"><table><thead><tr><th>Data / horário</th><th>Procedimento</th><th>Unidade</th><th>Status</th><th></th></tr></thead><tbody>${offset===0?evs.sort((a,b)=>a.day-b.day||a.start-b.start).map(e=>`<tr><td>${dateText(e.day)} · ${fmt(e.start)}</td><td><b>${esc(e.title)}</b></td><td>${e.unit}<br><small>${e.place}</small></td><td><span class="pill ${status[e.status].pill}">${status[e.status].text}</span></td><td><button class="link" onclick="eventDetail(${e.id})">Detalhes →</button></td></tr>`).join(''):'<tr><td colspan="5">Não há compromissos de exemplo nesta semana.</td></tr>'}</tbody></table></div>`}
function toggleFilter(k,v){v?filters.add(k):filters.delete(k);render()}
function audit(){return `${heading('Regulação e auditoria','Acompanhe a análise de solicitações e resolva suas pendências.')}<div style="display:flex;gap:10px;margin-bottom:22px"><span class="pill purple">5 solicitações</span><span class="pill orange">2 aguardam sua ação</span><span class="pill green">2 autorizadas</span></div><section class="panel"><div class="panel-head"><h2>Minhas solicitações</h2><input type="text" aria-label="Buscar solicitação" placeholder="Buscar por protocolo ou procedimento" oninput="filterRows(this.value)" style="width:280px"></div><div class="tablewrap"><table id="requests"><thead><tr><th>Protocolo</th><th>Procedimento / paciente</th><th>Solicitação</th><th>Status</th><th>Ação</th></tr></thead><tbody>${[['REG-2026-0148','Herniorrafia inguinal','Paciente exemplo B','Documentação pendente','orange','Enviar documentos'],['REG-2026-0149','Endoscopia digestiva','Paciente exemplo J','Justificativa pendente','orange','Enviar justificativa'],['REG-2026-0146','Colecistectomia','Paciente exemplo D','Autorizado','green','Ver autorização'],['REG-2026-0145','Ecocardiograma','Paciente exemplo I','Autorizado','green','Ver autorização'],['REG-2026-0150','Colonoscopia','Paciente exemplo L','Em análise','purple','Acompanhar']].map((r,i)=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}<br><small style="color:var(--muted)">${r[2]}</small></td><td>${i<2?'01/10/2026':'30/09/2026'}</td><td><span class="pill ${r[4]}">${r[3]}</span></td><td><button class="link" onclick="requestDetail(${i})">${r[5]} →</button></td></tr>`).join('')}</tbody></table></div></section>${footer()}`}
function payment(){return `${heading('Folha de pagamento','Sua produção e seus demonstrativos, de forma simples e transparente.',`<select aria-label="Competência" onchange="paymentMonth=this.value;render()"><option ${paymentMonth==='Setembro 2026'?'selected':''}>Setembro 2026</option><option ${paymentMonth==='Agosto 2026'?'selected':''}>Agosto 2026</option></select>`)}<div class="financial">${[['Produção bruta',paymentMonth==='Setembro 2026'?'R$ 28.450,00':'R$ 26.800,00'],['Descontos',paymentMonth==='Setembro 2026'?'R$ 4.267,50':'R$ 4.020,00'],['Valor líquido',paymentMonth==='Setembro 2026'?'R$ 24.182,50':'R$ 22.780,00']].map(([t,v])=>`<div class="panel"><p>${t}</p><strong>${v}</strong><p>Competência: ${paymentMonth}</p></div>`).join('')}</div><section class="panel"><div class="panel-head"><h2>Demonstrativos disponíveis</h2><span class="pill green">Valores demonstrativos</span></div><table><thead><tr><th>Competência</th><th>Tipo</th><th>Disponibilidade</th><th></th></tr></thead><tbody>${['Setembro 2026','Agosto 2026'].map(m=>`<tr><td><b>${m}</b></td><td>Produção médica</td><td><span class="pill green">Disponível</span></td><td><button class="link" onclick="paymentDetail('${m}')">${icon('file')} Ver demonstrativo</button></td></tr>`).join('')}</tbody></table></section>${footer()}`}
let paymentMonth='Setembro 2026';function filterRows(v){document.querySelectorAll('#requests tbody tr').forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(v.toLowerCase()))}function render(){$('#app').innerHTML=screen==='home'?home():screen==='audit'?audit():screen==='payment'?payment():calendar()}
let lastFocus;function showDialog(title,body,actions=''){lastFocus=document.activeElement;$('#dialogRoot').innerHTML=`<div class="dialog-back" onclick="if(event.target===this)closeDialog()"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialog-head"><h2>${title}</h2><button onclick="closeDialog()" aria-label="Fechar">×</button></div>${body}<div class="dialog-actions">${actions||'<button class="btn" onclick="closeDialog()">Fechar</button>'}</div></section></div>`;$('.dialog-head button').focus()}function closeDialog(){$('#dialogRoot').innerHTML='';lastFocus?.focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.key==='Tab'&&$('.dialog')){const nodes=[...$('.dialog').querySelectorAll('button,input,select,a')];const a=nodes[0],b=nodes.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function eventDetail(id){let e=events.find(e=>e.id===id);if(e.status==='available'){newEvent(e);return}showDialog(e.title,`<span class="pill ${status[e.status].pill}">${status[e.status].text}</span><div class="fields" style="margin-top:23px">${[['Data',dateText(e.day)+'/2026'],['Horário',fmt(e.start)+' – '+fmt(e.start+e.duration)],['Paciente',e.patient],['Unidade',e.unit],['Local',e.place],['Médico','Dr. João da Silva']].map(([k,v])=>`<div><label>${k}</label><strong>${v}</strong></div>`).join('')}</div><p style="font-size:11px;margin-top:25px">Compromisso de exemplo para avaliação do layout.</p>`,e.status==='pending'?`<button class="btn" onclick="closeDialog()">Fechar</button><button class="btn primary" onclick="closeDialog();go('audit')">Consultar regulação</button>`:'')}
function newEvent(e){showDialog(screen==='diagnostic'?'Agendar exame':'Solicitar agendamento',`<form id="booking" onsubmit="saveEvent(event)"><div class="fields"><label class="full">Procedimento<input name="title" type="text" placeholder="Informe o procedimento" required maxlength="65"></label><label>Data<input name="date" type="date" value="${e?dayDate(e.day).toISOString().slice(0,10):'2026-10-02'}" required min="2026-09-28" max="2026-10-02"></label><label>Horário<input name="time" type="time" value="${fmt(e?.start||8)}" required min="07:00" max="15:30" step="1800"></label><label>Unidade<select name="unit"><option>HMS</option><option>${screen==='diagnostic'?'Iguatemi':'Hospital Rodolfo'}</option></select></label><label>Duração<select name="duration"><option value="1">1 hora</option><option value="1.5">1 hora e 30 min</option></select></label></div><p style="font-size:11px;margin-top:18px">Simulação na semana de 28/09 a 02/10. A solicitação aparecerá na agenda enquanto esta página estiver aberta.</p><div class="dialog-actions"><button type="button" class="btn" onclick="closeDialog()">Cancelar</button><button class="btn primary" type="submit">Solicitar</button></div></form>`,' ')}
function saveEvent(evt){evt.preventDefault();let f=new FormData(evt.target);let date=new Date(f.get('date')+'T12:00:00');let day=(date.getDay()+6)%7;let [h,m]=f.get('time').split(':').map(Number);let start=h+m/60,duration=Number(f.get('duration'));if(start+duration>17){toast('Escolha um horário que termine até 17h.');return}let same=events.some(e=>e.type===screen&&e.day===day&&e.unit===f.get('unit')&&e.status!=='available'&&start<e.start+e.duration&&start+duration>e.start);if(same){toast('Há um compromisso nesse intervalo e unidade. Escolha outro horário.');return}events.push({id:Date.now(),type:screen,day,start,duration,title:f.get('title').trim(),patient:'Paciente de demonstração',unit:f.get('unit'),place:'Local a definir',status:'pending'});offset=0;filters.add('pending');closeDialog();render();toast('Solicitação simulada adicionada à agenda.')}
function requestDetail(i){let pending=i<2;showDialog(pending?'Complementar solicitação':'Detalhes da solicitação',`<span class="pill ${pending?'orange':'green'}">${pending?'Aguardando sua ação':i===4?'Em análise':'Autorizado'}</span><p style="margin-top:18px">${pending?'Para esta simulação, selecione um arquivo para complementar a documentação.':'Solicitação demonstrativa de procedimento médico. O acompanhamento ficará disponível neste espaço.'}</p>${pending?'<label style="display:block;margin-top:20px;font-size:12px">Documento complementar<input type="file" id="docfile" style="display:block;margin-top:10px;max-width:100%"></label>':''}<p style="font-size:11px">Os dados são fictícios. O documento não será enviado.</p>`,pending?'<button class="btn" onclick="closeDialog()">Cancelar</button><button class="btn primary" onclick="if(!document.querySelector(\'#docfile\').files.length){toast(\'Selecione um arquivo para simular.\')}else{closeDialog();toast(\'Documentação registrada na simulação. Nenhum arquivo foi enviado.\')}">Simular envio</button>':'')}
function paymentDetail(m){showDialog('Demonstrativo de produção',`<span class="pill orange">${m} · Exemplo</span><table style="margin-top:20px"><tbody><tr><td>Procedimentos cirúrgicos</td><td>R$ ${m==='Setembro 2026'?'18.200,00':'17.000,00'}</td></tr><tr><td>Exames e atendimentos</td><td>R$ ${m==='Setembro 2026'?'10.250,00':'9.800,00'}</td></tr><tr><td>Descontos</td><td>R$ ${m==='Setembro 2026'?'4.267,50':'4.020,00'}</td></tr><tr><td><b>Líquido</b></td><td><b>R$ ${m==='Setembro 2026'?'24.182,50':'22.780,00'}</b></td></tr></tbody></table><p style="font-size:11px">Valores fictícios para demonstração da interface.</p>`)}
render();
</script></body></html>
